services:
  backend:
    build: ./backend
    container_name: day4-backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine                          
    container_name: day4-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro    
      - ./certs:/etc/nginx/certs:ro              
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
