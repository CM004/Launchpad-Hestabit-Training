services:
  backend-alpha:
    build: ./backend
    container_name: backend-alpha
    networks:
      - app-network


  backend-beta:
    build: ./backend
    container_name: backend-beta
    networks:
      - app-network


  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-alpha
      - backend-beta
    networks:
      - app-network


networks:
  app-network:

 